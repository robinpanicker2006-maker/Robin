
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enjoy the moment, forget the past. — Robin Panicker">
  <title>Robin Panicker | My Quote</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #101114;
      color: #f5f5f5;
      font-family: Georgia, serif;
    }
    main {
      max-width: 700px;
      padding: 48px 25px;
      text-align: center;
      border: 1px solid #444;
      border-radius: 20px;
      background: #191a20;
    }
    h1 {
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.25;
    }
    .author {
      margin-top: 30px;
      font: 18px Arial, sans-serif;
      color: #d0d0d0;
    }
    .caption {
      margin-top: 40px;
      color: #aaa;
      font: 13px Arial, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <p>AN ORIGINAL QUOTE</p>
    <h1>“Enjoy the moment, forget the past.”</h1>
    <p class="author">— By Robin Panicker</p>
    <p class="caption">Live the moment. Keep moving forward.</p>
  </main>
</body>
</html>
